s="dashboard-main-grid">${panel('Environmental trends','Simulated twelve-month patterns',`<div class="chart-head-note"><span class="legend-dot green"></span> Soil moisture index (%) <span class="chart-unit">Jan – Dec · mock profile</span></div>${chart(e.monthly,'moisture')}`)}${panel('Your farm',`${escapeHTML(f.name)} · ${f.hectares} hectares`,`${mapGraphic()}<div class="farm-preview-footer"><div>${I('map',15)}<span>${escapeHTML(f.region)}, Chile</span></div>${chip('Demo profile','positive')}</div>`,textButton('View','farm'))}</div><div class="dashboard-lower-grid">${panel('What needs attention','Signals from the demo profile',`<div class="insight-list"><div class="insight-item"><div class="insight-symbol warning">${I('water',19)}</div><div><strong>${escapeHTML(f.stage)}</strong><p>${escapeHTML(f.water)}. Compare water demand across rotations.</p></div>${I('arrow',17)}</div><div class="insight-item"><div class="insight-symbol success">${I('sprout',19)}</div><div><strong>Soil-health opportunity</strong><p>${escapeHTML(f.soilConcern)}. Cover crops and legumes may be worth comparing.</p></div>${I('arrow',17)}</div><div class="insight-item"><div class="insight-symbol neutral">${I('bulb',19)}</div><div><strong>Suggested exploration</strong><p>${escapeHTML(recs()[0]?.title)}. Local review needed.</p></div>${I('arrow',17)}</div></div>`,textButton('All insights','recommendations'))}${panel('Rotation opportunities','Current sequence versus alternatives',`<div class="dashboard-rotation-list">${r.map(x=>`<button class="mini-rotation" data-page="comparison"><span class="mini-letter" style="background:${COLORS[x.id]}">${x.id}</span><span><b>${escapeHTML(x.title)}</b><small>${escapeHTML(x.focus)}</small></span><span class="mini-priority">${score(x)}<small>fit</small></span>${I('arrow',17)}</button>`).join('')}</div><div class="mini-rotation-note">${I('info',15)} Weighted values are simulated aids, not forecasts.</div>`,textButton('Compare','comparison'))}</div>${note()}`}

function strategyCard(r){return `<button class="rotation-card ${S.strategy===r.id?'selected':''}" style="--rotation-color:${COLORS[r.id]}" data-set="strategy" data-value="${r.id}"><div class="rotation-card-top"><span class="rotation-letter" style="background:${COLORS[r.id]}">${r.id}</span><span class="rotation-focus">${escapeHTML(r.focus)}</span></div><h3>${escapeHTML(r.title)}</h3><p>${escapeHTML(r.subtitle)}</p>${timeline(r,Math.min(4,S.horizon))}<div class="rotation-minis"><div><span>Soil potential</span><b>${r.soil}/100</b></div><div><span>Water demand</span><b>${r.water}/100</b></div></div><div class="rotation-footer"><span>Priority fit: <b>${score(r)}/100</b></span><span>${S.strategy===r.id?'Selected ✓':'Explore →'}</span></div></button>`}

:</b> ${escapeHTML(c.pests)}</div></div></div>${note('Crop properties, strategy scores and sequences are illustrative. Site-specific suitability, economics and agronomic constraints need verification.')}`}
function predictionChart(){let f=farm(),n=S.predictHorizon,baseline=f.soilMoisture;const days=[0,7,15,30].filter(d=>d<=n),dta=days.map(day=>({day,b:Math.max(9,Math.round(baseline-day*.13+Math.sin(day/5)*3)),d:Math.max(6,Math.round(baseline-day*.32))}));let W=650,H=265,p={l:36,r:20,t:13,b:29},x=i=>p.l+i*(W-p.l-p.r)/Math.max(1,days.length-1),y=v=>p.t+(65-v)*(H-p.t-p.b)/65;let path=k=>dta.map((a,i)=>`${i?'L':'M'}${x(i)},${y(a[k])}`).join(' ');return `<svg class="static-plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${[0,.25,.5,.75,1].map(q=>`<line x1="${p.l}" x2="${W-p.r}" y1="${p.t+(H-p.t-p.b)*q}" y2="${p.t+(H-p.t-p.b)*q}" stroke="#e5eee8" stroke-dasharray="4 5"/>`).join('')}<path d="${path('b')}" stroke="#35976b" fill="none" stroke-width="3"/><path d="${path('d')}" stroke="#dca65d" fill="none" stroke-width="3" stroke-dasharray="6 5"/>${days.map((d,i)=>`<text x="${x(i)}" y="${H-8}" fill="#899b90" text-anchor="middle" font-size="11">Day ${d}</text>`).join('')}</svg>`}
function predictive(){return `${pageTitle('HYPOTHETICAL PLANNING','Explore future scenarios.','Illustrative curves for planning conversations — not validated weather forecasts.',chip('NOT A REAL FORECAST','warning'))}<div class="prediction-banner"><div class="prediction-art">✧</div><div><b>Scenario explorer — demonstration only</b><p>These paths are generated from fixed arithmetic, not model output or probability estimates. No historical observations are connected.</p></div></div><div class="predictive-controls"><div><span class="detail-caption">PLANNING HORIZON</span><div class="segmented">${[7,15,30].map(n=>`<button class="${S.predictHorizon===n?'active':''}" data-set="predictHorizon" data-value="${n}">${n} days</button>`).join('')}</div></div><div><span class="detail-caption">ILLUSTRATIVE CONDITION</span><div class="segmented">${[['dry','Drier than usual'],['reference','Reference scenario']].map(([k,v])=>`<button class="${S.predictScenario===k?'active':''}" data-set="predictScenario" data-value="${k}">${v}</button>`).join('')}</div></div></div><div class="prediction-grid">${panel('Possible soil moisture paths',`${escapeHTML(farm().name)} · Hypothetical ${S.predictHorizon}-day horizon`,`<div class="chart-head-note"><span class="legend-dot green"></span> Reference <span class="legend-dot amber"></span> Drier scenario</div>${predictionChart()}<p class="chart-footnote">Purely hypothetical. Uncertainty has not been quantified.</p>`)}${panel('Potential planning impacts','Topics to discuss with a local expert',`<div class="impact-list"><div><span class="impact-symbol blue">${I('water',19)}</span><div><small>SOIL MOISTURE</small><strong>${S.predictScenario==='dry'?'Consider elevated water pressure':'Compare against a dry case'}</strong><p>Review irrigation allocation and crop-rooting depth.</p></div></div><div><span class="impact-symbol amber">${I('temp',19)}</span><div><small>TEMPERATURE</small><strong>Monitor sensitive crop stages</strong><p>Seasonal heat changes may shift planting windows.</p></div></div><div><span class="impact-symbol green">${I('sprout',19)}</span><div><small>CROP SELECTION</small><strong>Compare water-efficient alternatives</strong><p>Screen local suitability before trialing new crops.</p></div></div></div>`)}</div><div class="scenario-squares">${[['cloud','SHORT TERM','7–30 days','Illustrative water-stress pathways'],['calendar','SEASONAL','Growing seasons','Shifts in planting windows'],['compare','LONG TERM','Multiple years','Crop rotation resilience']].map(([ic,t,n,d])=>`<div><div class="scenario-symbol">${I(ic,23)}</div><small>${t}</small><strong>${n}</strong><p>${d}</p></div>`).join('')}</div>${note('There is no live forecast, historical observation stream or uncertainty model. Do not use these scenarios for time-critical agricultural decisions.')}`}
function comparison(){let r=rows(),weights={balanced:'Soil 20% · Low water demand 20% · Drought 20% · Market 20% · Ease of adoption 20%',soil:'Soil 38% · Nutrients 26% · Erosion 22% · Drought 14%',water:'Low water demand 58% · Drought 24% · Soil 18%',climate:'Drought 46% · Low water demand 23% · Erosion 20% · Soil 11%',market:'Market 62% · Adoption 22% · Low water demand 16%'};return `${pageTitle('TRADE-OFF ANALYSIS','Compare before you decide.','Your existing rotation appears alongside two alternatives. No universal winner.') }<div class="comparison-toolbar"><div><b>Evaluation priority</b><p>Weighted fit is a transparent demonstration, not a scientific score.</p></div>${selectPriority()}</div><div class="comparison-cards">${r.map(x=>`<div class="comparison-top-card" style="--rotation-color:${COLORS[x.id]}"><span class="compare-letter">${x.id}</span><div><small>STRATEGY ${x.id} · ${x.focus.toUpperCase()}</small><h3>${x.title}</h3><p>${x.subtitle}</p></div><div class="priority-fit"><strong>${score(x)}</strong><small>/100 weighted fit</small></div>${timeline(x,4)}</div>`).join('')}</div><div class="comparison-table-wrap"><table class="comparison-table"><thead><tr><th>CRITERION</th>${r.map(x=>`<th><span class="compare-dot" style="background:${COLORS[x.id]}"></span> STRATEGY ${x.id}</th>`).join('')}</tr></thead><tbody>${CRITERIA.map(([key,label,higher])=>`<tr><td><strong>${label}</strong><span>${higher?'Higher potential is preferable':'Lower demand is preferable'}</span></td>${r.map(x=>`<td><div class="table-metric"><strong>${x[key]}<small>/100</small></strong>${bar(x[key],COLORS[x.id])}</div></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="comparison-charts">${panel('Criterion-by-criterion view','See underlying differences without masking trade-offs',`<div class="horizontal-bars">${r.map(x=>`<div class="horizontal-bar-item"><div><strong>${x.title}</strong><span>${x.soil}/100</span></div>${bar(x.soil,COLORS[x.id])}</div>`).join('')}</div><p class="chart-footnote">Bars here show simulated soil health potential only.</p>`)}${panel('How the fit indicator works','Explicit weights and inversion',`<div class="weight-notes"><div class="weight-notes-icon">${I('settings',22)}</div><h3>${PRIORITIES[S.priority]}</h3><p>${weights[S.priority]}</p><span>All component inputs are on illustrative 0–100 scales. <b>Water demand is inverted (100 − demand)</b> for the composite fit only. No validated performance model is involved.</span></div>`)}</div>${panel('Benefits, trade-offs and missing evidence','For all three strategies',`<div class="tradeoffs-grid">${r.map(x=>`<div class="tradeoff"><b><span class="compare-dot" style="background:${COLORS[x.id]}"></span> Strategy ${x.id} · ${x.title}</b><div class="tradeoff-line">${I('check',17)}<p>${escapeHTML(x.benefit)}</p></div><div class="tradeoff-line caution">${I('warn',17)}<p>${escapeHTML(x.tradeoff)}</p></div><div class="tradeoff-line muted">${I('info',17)}<p>Missing local soil tests, yield estimates and verified economics.</p></div></div>`).join('')}</div>`)}${note('Scores and crop suitability are illustrative. Real decisions need local crop, climate, soil, water and market validation.')}`}
function recommendations(){let f=farm(),r=recs(),filtered=r.filter(x=>S.recFilter==='All'||x.kind===S.recFilter);return `${pageTitle('ACTIONABLE DECISION SUPPORT','Recommendations with reasons.',`Transparent, illustrative suggestions for ${escapeHTML(f.name)}.`)}<div class="rec-header"><div><span class="rec-header-icon">${I('bulb',25)}</span><div><b>Explore options, not prescriptions</b><p>Each idea includes supporting context, potential benefits, risks and uncertainty.</p></div></div></div>${filters(['All','Soil health','Water','Erosion'],S.recFilter,'recFilter')}<div class="recommendation-stack">${filtered.length?filtered.map((x,i)=>`<article class="recommendation-card"><span class="rec-number">0${i+1}</span><div class="rec-main"><div class="rec-top">${chip(x.severity,x.severity==='Attention'?'warning':'positive')}<span class="rec-kind">${x.kind}</span></div><h3>${escapeHTML(x.title)}</h3><p>${escapeHTML(x.reason)}</p><div class="rec-facts"><div><strong>${I('check',15)} Potential benefit</strong><span>${escapeHTML(x.benefit)}</span></div><div><strong>${I('warn',15)} What to validate</strong><span>${escapeHTML(x.risk)}</span></div></div><div class="rec-bottom"><span>${I('info',14)} ${escapeHTML(x.uncertainty)}</span>${textButton('Explore strategy '+x.strategy,'comparison')}</div></div></article>`).join(''):'<div class="panel empty-state">No suggestions in this category for this mock farm.</div>'}</div>${note('Recommendations are decision-support prompts only. Consult appropriate local experts before action.')}`}
function reports(){let f=farm();return `${pageTitle('DOCUMENTATION / EXPORTS','Turn insights into a report.','Prepare an explainable summary for agronomic review.') }<div class="report-grid">${panel('Prepare your report','Export a locally generated, offline-readable farm summary',`<div class="report-choice-list">${[['profile','Farm profile & soil context'],['conditions','Environmental conditions'],['rotations','Rotation scenarios & criteria'],['recs','Recommendations & trade-offs'],['risks','Information gaps & limitations']].map(([k,label])=>`<label class="report-choice"><input type="checkbox" data-report="${k}" ${S.reportSections[k]?'checked':''}><span>${label}</span>${I('check',16)}</label>`).join('')}</div><div class="report-actions"><button class="primary-button" data-action="exportReport">${I('download',17)} Export HTML report</button><button class="secondary-button" data-action="print">${I('file',17)} Print / Save PDF</button></div><p class="chart-footnote">All core report sections are exported to preserve context. Section toggles affect preview preferences only.</p>`)}<div class="report-preview"><div class="report-preview-top"><span>TERRAAI <b>REPORT</b></span><span>DEMO / 2026</span></div><div class="report-preview-body"><div class="overline">AGRICULTURAL DECISION SUPPORT</div><h2>Farm strategy assessment</h2><p>${escapeHTML(f.name)}<br>${escapeHTML(f.region)}, Chile</p><div class="report-preview-line"></div><div class="report-preview-metrics"><span>${f.hectares} ha<small>AREA</small></span><span>${rows().length}<small>STRATEGIES</small></span><span>${recs().length}<small>INSIGHTS</small></span></div><h3>What this report includes</h3><ul><li>Farm and environmental context</li><li>Three comparable crop rotations</li><li>Trade-offs and open questions</li></ul><div class="report-stamp">ALL CONTENT SIMULATED</div></div></div></div>${note('Export reports contain only simulated data. Use Save as PDF from the browser print dialog if you require a PDF.')}`}
function sources(){let q=S.sourceSearch.toLowerCase(),s=DB.sources.filter(x=>(S.sourceCategory==='All'||S.sourceCategory===x.category)&&(x.name+' '+x.variables+' '+x.institution).toLowerCase().includes(q));return `${pageTitle('SCIENTIFIC TRANSPARENCY','Built to connect with real Earth data.','An inventory of candidate services for future integration.',chip('0 SOURCES CONNECTED','warning'))}<div class="sources-intro"><span class="source-intro-symbol">${I('database',26)}</span><div><b>Integration roadmap, not a live data feed</b><p>Statuses such as “Selected” indicate research priorities, not live connections, completed downloads or validated local coverage.</p></div></div><div class="sources-tools">${filters(['All','NASA observations','Geospatial & climate','Soil & agriculture'],S.sourceCategory,'sourceCategory')}<label class="source-search">${I('search',17)}<input data-key="sourceSearch" value="${escapeHTML(S.sourceSearch)}" placeholder="Search a source or variable…"></label></div><div class="source-summary"><span>${s.length} of ${DB.sources.length} candidates</span><span><i></i> Integration status: research only</span></div><div class="source-list"><div class="source-list-head"><span>DATA SOURCE</span><span>VARIABLES & PURPOSE</span><span>STATUS</span><span>OFFICIAL LINK</span></div>${s.map(x=>`<div class="source-list-row"><div><span class="source-monogram">${x.name.slice(0,2).toUpperCase()}</span><div><strong>${escapeHTML(x.name)}</strong><small>${escapeHTML(x.institution)}</small></div></div><div><strong>${escapeHTML(x.variables)}</strong><small>${escapeHTML(x.application)}</small></div><div>${chip(x.status,x.status==='Selected'?'positive':x.status==='Under evaluation'?'sky':'neutral')}</div><div><a href="${escapeHTML(x.url)}" target="_blank" rel="noreferrer">Official website ${I('external',15)}</a></div></div>`).join('')}${s.length?'':'<div class="empty-state">No sources found. Try different terms.</div>'}</div>${note('No data services are connected. This interface makes no external requests; the official links open only when clicked.')}`}
function main(){return ({overview:dashboard,farm:myFarm,environment,explorer,predictive,comparison,recommendations,reports,sources}[S.page]||dashboard)()}
function render(){document.getElementById('app').innerHTML=`${S.mobile?'<div class="mobile-scrim" data-set="mobile" data-value="false"></div>':''}<div class="app-shell">${sidebar()}<div class="app-main">${header()}<div class="offline-banner">${I('check',13)} Fully interactive <strong>offline demonstration</strong> · built with simulated data · the downloadable React project is the implementation foundation</div><main class="page-body">${main()}</main><footer class="app-footer"><span>© TerraAI · Agricultural decision-support prototype</span><span>NASA Space Apps Challenge 2026 concept · No live satellite or ML integration</span></footer></div></div><div id="messageLayer"></div>`;}
function navigate(p){S.page=p;S.mobile=false;window.scrollTo(0,0);render()}
function showToast(msg){const l=document.getElementById('messageLayer');l.innerHTML=`<div class="toast" role="status">${I('check',18)} ${escapeHTML(msg)} <button data-action="dismiss">✕</button></div>`;setTimeout(()=>{let layer=document.getElementById('messageLayer');if(layer)layer.innerHTML=''},3100)}
function exportReport(){let f=farm(),rs=rows(),items=recs(),esc=escapeHTML;let content=`<!doctype html><html lang="en"><meta charset="utf-8"><title>TerraAI ${esc(f.name)} report</title><style>body{font-family:Arial,sans-serif;color:#24483d;max-width:900px;margin:40px auto;line-height:1.6}h1{color:#24825b}table{border-collapse:collapse;width:100%;margin:16px 0}td,th{padding:10px;border:1px solid #dae8df;text-align:left}th{background:#eff8f2}.notice{background:#fff4df;border-left:4px solid #bd883c;padding:15px}</style><small>TERRAAI / SIMULATED DATA / 2026</small><h1>Farm rotation assessment</h1><h2>${esc(f.name)}</h2><p>${esc(f.region)}, Chile · ${f.hectares} hectares · ${esc(f.soil)} soil · organic matter ${f.organicMatter}%</p><p>Planning priority: ${esc(PRIORITIES[S.priority])}</p><h2>Environmental snapshot</h2><p>Soil moisture ${f.soilMoisture}% · Rainfall ${f.precipitation} mm · Temperature ${f.temperature}°C · NDVI ${f.ndvi}. All simulated.</p><h2>Rotation strategies</h2><table><tr><th>Scenario</th><th>Crop sequence</th><th>Soil potential</th><th>Water demand</th><th>Priority fit</th></tr>${rs.map(r=>`<tr><td>${r.id} ${esc(r.title)}</td><td>${r.crops.map(id=>esc(crop(id)?.name||id)).join(' → ')}</td><td>${r.soil}/100</td><td>${r.water}/100</td><td>${score(r)}/100</td></tr>`).join('')}</table><h2>Decision-support prompts</h2><ul>${items.map(x=>`<li><strong>${esc(x.title)}:</strong> ${esc(x.reason)}<br>Risk: ${esc(x.risk)}</li>`).join('')}</ul><h2>Information gaps</h2><p>Verified field soil sampling, local crop suitability, market access, economics, yields, observed weather and validated predictions are not available.</p><p class="notice"><strong>SIMULATION:</strong> This report is for demonstrating UX and comparison logic. It is not a scientific evaluation or farming prescription. No live NASA datasets have been used.</p></html>`;let blob=new Blob([content],{type:'text/html;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='TerraAI_'+f.id+'_demo_report.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);showToast('Illustrative HTML report exported')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-set],[data-action]');if(!b)return;if(b.hasAttribute('data-page')){navigate(b.dataset.page);return;}if(b.hasAttribute('data-set')){let key=b.dataset.set,v=b.dataset.value;S[key]=['horizon','predictHorizon','expandedDef'].includes(key)?Number(v):['mobile','notice'].includes(key)?v==='true':v;render();return;}if(b.dataset.action==='exportReport'){exportReport()}else if(b.dataset.action==='print'){window.print()}else if(b.dataset.action==='saveNotes'){showToast('Planning notes saved for this session')}else if(b.dataset.action==='dismiss'){let x=document.getElementById('messageLayer');if(x)x.innerHTML=''}});
document.addEventListener('change',e=>{let b=e.target;if(b.dataset.report){S.reportSections[b.dataset.report]=b.checked;return;}let k=b.dataset.key;if(!k)return;if(['irrigation','market','notes'].includes(k))S[k][S.farm]=b.value;else S[k]=['horizon','predictHorizon'].includes(k)?Number(b.value):b.value;render();});
document.addEventListener('input',e=>{let b=e.target;if(b.dataset.key==='notes'){S.notes[S.farm]=b.value;return;}if(b.dataset.key!=='sourceSearch')return;let start=b.selectionStart;S.sourceSearch=b.value;render();let input=document.querySelector('[data-key=sourceSearch]');if(input){input.focus();input.setSelectionRange(start,start);}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.dataset.id==='pageSearch'){let q=e.target.value.toLowerCase().trim(),n=NAV.find(x=>x[1].toLowerCase().includes(q));if(n)navigate(n[0]);else showToast('No matching page found');}});
render();
</script></body></html>
